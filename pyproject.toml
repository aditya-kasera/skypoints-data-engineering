[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skypoints-data-engineering"
version = "0.1.0"
description = "Data engineering technical assessment foundation for SkyPoints"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.1,<2",
    "openpyxl>=3.1,<4",
    "pandas>=2.2,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
